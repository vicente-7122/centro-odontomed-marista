<style>
:root{--bg:#FAFAF8;--sand:#F5F0E8;--gold:#B89B6A;--bronze:#8F7448;--ink:#3D3A36;--mut:#6B665F;--line:#E8E0D2;--r:18px;--sh:0 6px 24px rgba(61,58,54,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(78px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;font-weight:500;line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5.5vw,3.2rem)}h2{font-size:clamp(1.55rem,3.6vw,2.2rem)}h3{font-size:1.08rem}
p{margin:0}a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--bronze);outline-offset:3px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
section{padding:84px 0}.alt{background:var(--sand)}.wht{background:#fff}
.lead{color:var(--mut);margin-top:12px;max-width:56ch}
.head{margin-bottom:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font:500 1rem Poppins,sans-serif;text-decoration:none;border:1.5px solid var(--bronze);background:var(--bronze);color:#fff;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:#7a6340;transform:translateY(-1px)}
.btn.o{background:transparent;color:var(--bronze)}.btn.o:hover{background:rgba(184,155,106,.14)}
.ic{width:24px;height:24px;stroke:var(--bronze);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:26px}
.alt .card{background:var(--bg)}
.ph{border-radius:var(--r);object-fit:cover;width:100%;box-shadow:var(--sh)}
/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(250,250,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:500 1.05rem Poppins,sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo svg{width:30px;height:30px}
nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;align-items:center}
nav a{text-decoration:none;font-size:.95rem}nav a:not(.btn):hover{color:var(--bronze)}
nav .btn{min-height:42px;padding:0 20px;font-size:.9rem;color:#fff}
#burger{display:none;background:none;border:0;width:48px;height:48px;cursor:pointer;padding:0}
#burger span{display:block;width:24px;height:2px;background:var(--ink);margin:6px auto;transition:.2s}
@media(max-width:860px){#burger{display:block}
nav ul{position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;padding:8px 22px 20px;border-bottom:1px solid var(--line);display:none}
nav ul.open{display:flex}nav li a{display:block;padding:13px 0}nav li .btn{margin-top:8px}}
/* hero */
.hero{position:relative;padding:0;min-height:min(92vh,780px);display:flex;align-items:flex-end}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .wrap{position:relative;padding-top:120px;padding-bottom:48px;width:100%}
.hbox{background:rgba(250,250,248,.9);border-radius:24px;padding:34px;max-width:560px;box-shadow:var(--sh)}
.hbox p.lead{margin:14px 0 24px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.seal{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.92rem;margin-top:22px}
.seal b{font-weight:500}.star{color:var(--gold);letter-spacing:2px}
/* grids */
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.two .ph{aspect-ratio:3/2}
.doc .ph{aspect-ratio:4/5;object-position:top;max-width:440px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.tag{border:1px solid var(--gold);border-radius:999px;padding:5px 14px;font-size:.88rem;background:#fff}
.sub{color:var(--bronze);font-weight:500;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.spec{display:flex;flex-direction:column;gap:12px}.spec p{color:var(--mut);font-size:.95rem;line-height:1.55}
.note{margin-top:34px;text-align:center;color:var(--mut)}.note .btn{margin-top:16px}
.supp{margin:0 auto 34px;max-width:720px}.supp .ph{aspect-ratio:3/2;object-position:center}
.q{font-size:.98rem}.q footer{margin-top:14px;color:var(--mut);font-size:.88rem;background:none;border:0;padding:0;position:static}
.sealrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:30px}
.lnk{color:var(--bronze);font-size:.95rem}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 22px;margin-bottom:12px}
summary{cursor:pointer;padding:18px 0;font:500 1rem Poppins,sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px;min-height:48px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--bronze);font-size:1.5rem;line-height:1;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding-bottom:18px;color:var(--mut)}
.faq{max-width:760px}
.info{display:flex;flex-direction:column;gap:16px;margin:24px 0}
.info div{display:flex;gap:14px;align-items:flex-start}.info a{text-decoration:none}.info a:hover{color:var(--bronze)}
.map{width:100%;height:420px;border:0;border-radius:var(--r);box-shadow:var(--sh)}
.mapalt{margin-top:10px;display:none}
.contact .ph{aspect-ratio:4/3;margin-top:20px}
form{margin-top:40px;display:grid;gap:14px;max-width:640px}
label{font-size:.92rem;display:grid;gap:6px}
input[type=text],input[type=tel],textarea{font:inherit;padding:14px 16px;border:1.5px solid #cfc5b3;border-radius:12px;background:#fff;color:var(--ink);min-height:50px;width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--bronze)}
.err{color:#9b3b2e;font-size:.85rem;min-height:1em}
/* footer */
footer.site{background:var(--sand);padding:48px 0 90px;font-size:.92rem;color:var(--mut);position:static;border-top:1px solid var(--line)}
.fl{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0}.fl a,.fl button{color:var(--ink);background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;padding:0}
/* floating + cookies + modal */
.wa{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:60px;height:60px;border-radius:50%;background:var(--bronze);display:grid;place-items:center;box-shadow:0 8px 22px rgba(61,58,54,.2)}
.wa svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#ck{position:fixed;left:16px;right:90px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px 18px;font-size:.88rem;display:none;gap:14px;align-items:center;flex-wrap:wrap;max-width:620px}
#ck .btn{min-height:40px;padding:0 20px;font-size:.88rem}
dialog{border:1px solid var(--line);border-radius:var(--r);max-width:620px;width:calc(100% - 32px);padding:28px;color:var(--ink);background:var(--bg);max-height:85vh}... (3 MB restante(s))
